<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Film Advent Calendar</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="lights" aria-hidden="true"></div>
<header>
  <div class="marquee">
    <p class="now">Now showing</p>
    <h1>Christmas Film Advent Calendar <span id="calYear"></span></h1>
    <p>Open tonight's door to find out what we're watching.</p>
  </div>
</header>
<ol id="grid"></ol>

<dialog id="dlg" aria-labelledby="filmTitle">
  <div class="stripe">Admit one · Christmas film night</div>
  <div class="card">
    <div class="day" id="dlgDay"></div>
    <h2 id="filmTitle"></h2>
    <p class="year" id="filmYear"></p>
    <dl class="facts">
      <div><dt>IMDb rating</dt><dd id="filmRating"></dd></div>
      <div><dt>Watch on</dt><dd id="filmService"></dd></div>
    </dl>
    <button id="close" autofocus>Close</button>
  </div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="calendar-data.js"></script>
<script type="module" src="dist/main.js"></script>
</body>
</html>
