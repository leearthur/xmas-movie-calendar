<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12050a">
<title>Christmas Film Advent Calendar</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="lights" aria-hidden="true"></div>
<header>
  <div class="marquee">
    <p class="now">Now showing</p>
    <h1>Christmas Film Advent Calendar <span id="calYear"></span></h1>
  </div>
</header>
<main>
<ol id="grid"></ol>
</main>

<dialog id="dlg" aria-labelledby="filmTitle" aria-describedby="dlgSummary">
  <div class="stripe">Admit one · Christmas film night</div>
  <div class="card">
    <p class="sr-only" id="dlgSummary"></p>
    <div class="day" id="dlgDay"></div>
    <h2 id="filmTitle"></h2>
    <p class="year" id="filmYear"></p>
    <dl class="facts">
      <div><dt>IMDb rating</dt><dd id="filmRating"></dd></div>
      <div><dt>Watch on</dt><dd id="filmService"></dd></div>
    </dl>
    <button id="close" autofocus>Close</button>
  </div>
</dialog>
<!-- shown in test mode (?preview or ?date) -->
<dialog id="unlockDlg" aria-labelledby="unlockTitle">
  <div class="stripe">Test mode</div>
  <form class="card unlock" id="unlockForm">
    <h2 id="unlockTitle">Who's testing?</h2>
    <p>Enter the curator's passphrase to see the real films, or carry on with made-up test films.</p>
    <div class="pass-field">
      <input type="password" id="unlockPass" autocomplete="off" aria-label="Curator's passphrase" placeholder="Curator's passphrase">
      <button type="button" class="reveal" id="revealPass" aria-label="Show passphrase" aria-pressed="false">
        <svg class="eye" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/>
          <circle cx="12" cy="12" r="3"/>
          <path class="slash" d="M3 3l18 18"/>
        </svg>
      </button>
    </div>
    <p class="sr-only" id="revealStatus" role="status" aria-live="polite"></p>
    <p class="unlock-error" id="unlockError" role="alert" hidden>That passphrase isn't right.</p>
    <div class="buttons">
      <button type="button" class="secondary" id="useTestFilms">Use test films</button>
      <button type="submit">Unlock</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="announce" class="sr-only" role="status" aria-live="polite"></div>

<script src="calendar-data.js"></script>
<script type="module" src="dist/main.js"></script>
</body>
</html>
